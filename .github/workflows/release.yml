name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: rust
        run: npm ci

      - name: Run Rust unit tests
        working-directory: rust/src-tauri
        run: cargo test

      - name: Build no-bundle release executable
        working-directory: rust
        run: npm run build:no-bundle

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-tts-gui-rust-windows-x64
          path: rust/src-tauri/target/release/edge-tts-gui-rust.exe
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "rust/src-tauri/target/release/edge-tts-gui-rust.exe"
          if (-not (Test-Path $asset)) {
            throw "Release binary not found: $asset"
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title $tag --generate-notes
          }
